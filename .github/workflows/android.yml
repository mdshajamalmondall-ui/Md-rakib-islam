name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install API 36.1
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error title=Android SDK Setup Failed::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" 2>&1 | tee /tmp/sdk.log || {
            set +e
            ERR=$(tail -n 15 /tmp/sdk.log | tr '\n' ' ')
            echo "::error title=Android SDK Setup Failed::${ERR:-sdkmanager failed}"
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare and verify signing keystore & Firebase config
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_B64_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64_SECRET" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64_SECRET" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::error title=Missing Debug Keystore::debug.keystore.base64 is missing from the repository and DEBUG_KEYSTORE_BASE64 secret is not set. Google Sign-In requires the registered debug keystore."
            exit 1
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_B64_SECRET" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64_SECRET" | base64 -d > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::error title=Missing Firebase Config::app/google-services.json is missing from the repository and GOOGLE_SERVICES_JSON secret is not set. Upload app/google-services.json or set the secret so Google Sign-In works."
            exit 1
          fi

          SHA1_HEX=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -iE "SHA1:|SHA-1:" | head -n 1 | sed -E 's/.*SHA-?1:[[:space:]]*//I' | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "Signing keystore SHA-1: $SHA1_HEX"
          if [ -z "$SHA1_HEX" ] || ! grep -qi "$SHA1_HEX" app/google-services.json; then
            echo "::error title=Keystore SHA-1 Mismatch::Debug keystore SHA-1 ($SHA1_HEX) is not registered in app/google-services.json. Google Sign-In will fail until they match."
            exit 1
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" --stacktrace 2>&1 | tee /tmp/assemble.log || {
            set +e
            ERR=$(grep -E "^(e: |FAILURE:|Execution failed|> |.*Exception|.*Error|.*Unresolved)" /tmp/assemble.log | head -n 12 | tr '\n' ' ')
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 15 /tmp/assemble.log | tr '\n' ' ')
            fi
            echo "::error title=Debug APK Build Failed::${ERR:-See build step logs}"
            exit 1
          }

      - name: Run Unit Tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" --stacktrace 2>&1 | tee /tmp/test.log || {
            set +e
            ERR=$(grep -E "^(e: |FAILURE:|Execution failed|> |.*Exception|.*Error|.*FAILED)" /tmp/test.log | head -n 12 | tr '\n' ' ')
            if [ -z "$ERR" ]; then
              ERR=$(tail -n 15 /tmp/test.log | tr '\n' ' ')
            fi
            echo "::error title=Unit Tests Failed::${ERR:-See test step logs}"
            exit 1
          }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: nursing-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
